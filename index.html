<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendex — Streak Tracker</title>

    <style>
        /* ============================================
           CSS VARIABLES / THEMING
           ============================================ */
        :root {
            --bg-primary: #f0f2f8;
            --bg-secondary: #ffffff;
            --bg-panel: rgba(255, 255, 255, 0.60);
            --bg-card: rgba(255, 255, 255, 0.50);
            --bg-glass: rgba(255, 255, 255, 0.12);
            --border-subtle: rgba(0, 0, 0, 0.06);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-strong: 0 16px 48px rgba(0, 0, 0, 0.10);
            --shadow-glow: 0 0 60px rgba(108, 99, 255, 0.10);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.04);
            --accent: #6C63FF;
            --accent-hover: #5a52d9;
            --accent-glow: rgba(108, 99, 255, 0.20);
            --success: #2ecc71;
            --danger: #ff6b6b;
            --warning: #feca57;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.15);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        [data-theme="dark"] {
            --bg-primary: #0b0b1a;
            --bg-secondary: #14142b;
            --bg-panel: rgba(20, 20, 43, 0.80);
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0c0;
            --text-muted: #606080;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-strong: 0 16px 48px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 60px rgba(108, 99, 255, 0.06);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
            --accent-glow: rgba(108, 99, 255, 0.12);
            --gold-dim: rgba(255, 215, 0, 0.10);
        }

        /* ============================================
           RESET & BASE
           ============================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            transition: background var(--transition), color var(--transition);
            line-height: 1.6;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 25%, rgba(108, 99, 255, 0.06) 0%, transparent 55%),
                radial-gradient(circle at 85% 75%, rgba(108, 99, 255, 0.06) 0%, transparent 55%);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 99px;
        }

        /* ============================================
           PARTICLES & CONFETTI
           ============================================ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* ============================================
           APP CONTAINER
           ============================================ */
        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-panel);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid var(--border-subtle);
            border-radius: 40px;
            padding: 28px 32px 36px;
            box-shadow: var(--shadow-strong), var(--shadow-glow);
            transition: background var(--transition), border var(--transition), box-shadow var(--transition);
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), #a855f7, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
            font-weight: 450;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-actions button {
            padding: 7px 14px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(4px);
        }

        .header-actions button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-2px);
        }

        .header-actions button:active {
            transform: scale(0.94);
        }

        .theme-toggle {
            width: 50px;
            height: 26px;
            border-radius: 99px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            position: relative;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .theme-toggle .dot {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            transition: transform var(--transition), background var(--transition);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .theme-toggle[data-theme="dark"] .dot {
            transform: translateX(24px);
            background: #f0e6ff;
        }
        .theme-toggle .icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            pointer-events: none;
            opacity: 0.4;
            transition: opacity var(--transition);
        }
        .theme-toggle .icon-sun {
            left: 5px;
        }
        .theme-toggle .icon-moon {
            right: 5px;
        }
        .theme-toggle[data-theme="dark"] .icon-sun {
            opacity: 0.2;
        }
        .theme-toggle[data-theme="dark"] .icon-moon {
            opacity: 0.9;
        }
        .theme-toggle:not([data-theme="dark"]) .icon-sun {
            opacity: 0.9;
        }
        .theme-toggle:not([data-theme="dark"]) .icon-moon {
            opacity: 0.2;
        }

        /* ============================================
           STATS BAR
           ============================================ */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            margin-bottom: 24px;
            padding: 14px 18px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(8px);
        }

        .stat-item {
            text-align: center;
            padding: 2px 0;
        }
        .stat-item .stat-number {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            display: block;
            line-height: 1.2;
            transition: color var(--transition);
        }
        .stat-item .stat-number.animate {
            animation: countUp 0.45s ease-out;
        }
        @keyframes countUp {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(6px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .stat-item .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-item.highlight .stat-number {
            color: var(--gold);
        }
        .stat-item.highlight .stat-label {
            color: var(--gold);
            opacity: 0.7;
        }

        /* ============================================
           CREATE SECTION
           ============================================ */
        .create-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(8px);
            margin-bottom: 24px;
            transition: all var(--transition);
            box-shadow: var(--shadow-card);
        }
        .create-section:hover {
            border-color: rgba(108, 99, 255, 0.15);
        }
        .create-section .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.02em;
        }

        .create-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .create-row .form-group {
            flex: 1;
            min-width: 130px;
        }
        .create-row .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 3px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .create-row .form-group input,
        .create-row .form-group select {
            width: 100%;
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all var(--transition);
            outline: none;
        }
        .create-row .form-group input:focus,
        .create-row .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .create-row .form-group input::placeholder {
            color: var(--text-muted);
        }

        .create-row .btn-create {
            padding: 9px 28px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), #a855f7);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            box-shadow: 0 4px 20px var(--accent-glow);
            white-space: nowrap;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .create-row .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }
        .create-row .btn-create:active {
            transform: scale(0.94);
        }

        /* ============================================
           CONTROLS
           ============================================ */
        .controls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            align-items: center;
        }
        .controls-row .search-box {
            flex: 1;
            min-width: 160px;
            position: relative;
        }
        .controls-row .search-box input {
            width: 100%;
            padding: 7px 14px 7px 34px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            transition: all var(--transition);
            outline: none;
            backdrop-filter: blur(4px);
        }
        .controls-row .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .controls-row .search-box .search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
        }

        .controls-row .filter-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .controls-row .filter-group button {
            padding: 5px 14px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }
        .controls-row .filter-group button:hover {
            color: var(--text-primary);
            border-color: var(--accent);
        }
        .controls-row .filter-group button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ============================================
           CHALLENGE CARDS — Square Grid
           ============================================ */
        .challenges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .challenge-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-subtle);
            transition: all var(--transition);
            animation: slideUp 0.4s ease;
            backdrop-filter: blur(6px);
            box-shadow: var(--shadow-card);
            padding: 18px 16px 14px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            aspect-ratio: 1 / 0.85;
            min-height: 180px;
        }
        .challenge-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-glow);
            transform: translateY(-4px);
        }
        .challenge-card:active {
            transform: scale(0.96);
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-icon {
            font-size: 28px;
            line-height: 1;
            margin-bottom: 6px;
        }
        .card-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .card-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 99px;
            background: var(--accent-glow);
            color: var(--accent);
            display: inline-block;
            align-self: flex-start;
            margin-bottom: 8px;
        }
        .card-badge.completed {
            background: rgba(46, 204, 113, 0.13);
            color: var(--success);
        }

        .card-stats-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid var(--border-subtle);
        }
        .card-stats-row span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .card-stats-row .num {
            font-weight: 700;
            color: var(--text-primary);
        }
        .card-stats-row .streak {
            color: var(--gold);
            font-weight: 700;
        }

        .card-progress-wrap {
            width: 100%;
            height: 4px;
            background: var(--bg-primary);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 8px;
        }
        .card-progress-wrap .progress-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
        }
        .card-progress-wrap .progress-fill.complete {
            background: linear-gradient(90deg, var(--success), #2ecc71);
        }

        .card-footer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .challenge-card:hover .card-footer-actions {
            opacity: 1;
        }
        .card-footer-actions button {
            padding: 2px 8px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }
        .card-footer-actions button:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--accent);
        }
        .card-footer-actions .btn-delete:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(255, 107, 107, 0.08);
        }
        .card-footer-actions .btn-reset:hover {
            color: var(--warning);
            border-color: var(--warning);
            background: rgba(254, 202, 87, 0.08);
        }

        .card-click-hint {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0.3;
            pointer-events: none;
            transition: opacity var(--transition);
        }
        .challenge-card:hover .card-click-hint {
            opacity: 0.7;
        }

        /* ============================================
           DETAIL MODAL — Centered Calendar View
           ============================================ */
        .detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.3s ease;
        }
        .detail-overlay.active {
            display: flex;
        }

        .detail-modal {
            background: var(--bg-secondary);
            border-radius: 36px;
            max-width: 680px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-strong), 0 0 80px var(--accent-glow);
            border: 1px solid var(--border-subtle);
            animation: modalPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 32px 36px 28px;
            position: relative;
        }
        .detail-modal::-webkit-scrollbar {
            width: 4px;
        }
        .detail-modal::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 99px;
        }

        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .detail-header .detail-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .detail-header .detail-icon {
            font-size: 36px;
        }
        .detail-header .detail-name {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .detail-header .detail-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 99px;
            background: var(--accent-glow);
            color: var(--accent);
            white-space: nowrap;
            align-self: center;
        }
        .detail-header .detail-badge.completed {
            background: rgba(46, 204, 113, 0.13);
            color: var(--success);
        }

        .detail-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: all var(--transition);
            line-height: 1;
            flex-shrink: 0;
        }
        .detail-close:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .detail-stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding: 12px 0 10px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .detail-stats span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .detail-stats .num {
            font-weight: 700;
            color: var(--text-primary);
        }
        .detail-stats .streak {
            color: var(--gold);
            font-weight: 700;
        }

        .detail-progress-wrap {
            width: 100%;
            height: 6px;
            background: var(--bg-primary);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 18px;
        }
        .detail-progress-wrap .progress-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
        }
        .detail-progress-wrap .progress-fill.complete {
            background: linear-gradient(90deg, var(--success), #2ecc71);
        }

        .detail-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
        }

        .detail-day {
            aspect-ratio: 1;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border-subtle);
            background: var(--bg-glass);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            user-select: none;
            min-width: 32px;
            min-height: 32px;
        }
        .detail-day:hover {
            transform: scale(1.08);
            border-color: var(--accent);
            z-index: 2;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .detail-day .day-number {
            font-size: 13px;
            font-weight: 600;
            line-height: 1;
            transition: opacity 0.2s;
        }
        .detail-day .day-check {
            font-size: 15px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: absolute;
        }

        .detail-day.completed {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .detail-day.completed .day-number {
            opacity: 0;
        }
        .detail-day.completed .day-check {
            opacity: 1;
            transform: scale(1);
        }
        .detail-day.completed.pop {
            animation: popComplete 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popComplete {
            0% {
                transform: scale(0.6);
                opacity: 0.5;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .detail-day.streak {
            background: var(--gold);
            border-color: var(--gold);
            color: #1a1a2e;
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.25);
        }
        .detail-day.streak .day-number {
            opacity: 0;
        }
        .detail-day.streak .day-check {
            opacity: 1;
            transform: scale(1);
        }
        .detail-day.streak .day-check::after {
            content: '🔥';
            font-size: 11px;
            margin-left: 1px;
        }

        .detail-day.today {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.12);
        }
        .detail-day.today::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold);
        }

        .detail-day .day-tooltip {
            position: absolute;
            bottom: calc(100% + 4px);
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 9px;
            white-space: nowrap;
            box-shadow: var(--shadow-strong);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
        }
        .detail-day:hover .day-tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .detail-day.has-note .day-number::after {
            content: '📝';
            font-size: 8px;
            margin-left: 1px;
            opacity: 0.7;
        }
        .detail-day.completed.has-note .day-check::after {
            content: '📝';
            font-size: 8px;
            margin-left: 1px;
            opacity: 0.7;
        }

        .detail-actions-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border-subtle);
        }
        .detail-actions-row button {
            padding: 6px 16px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }
        .detail-actions-row button:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--accent);
        }
        .detail-actions-row .btn-reset-detail:hover {
            color: var(--warning);
            border-color: var(--warning);
            background: rgba(254, 202, 87, 0.08);
        }
        .detail-actions-row .btn-delete-detail:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(255, 107, 107, 0.08);
        }

        /* ============================================
           ACHIEVEMENTS
           ============================================ */
        .achievements-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
        }
        .achievements-section .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .achievements-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .achievement-badge {
            padding: 6px 16px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-glass);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all var(--transition);
            opacity: 0.25;
        }
        .achievement-badge.unlocked {
            opacity: 1;
            border-color: var(--gold);
            background: var(--gold-dim);
            color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.06);
            animation: badgeUnlock 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes badgeUnlock {
            0% {
                transform: scale(0.4) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        .achievement-badge .badge-icon {
            font-size: 16px;
        }

        /* ============================================
           NOTE MODAL (reuse existing)
           ============================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 36px;
            padding: 36px 40px 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-strong), 0 0 80px var(--accent-glow);
            border: 1px solid var(--border-subtle);
            animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .modal::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, transparent, rgba(108, 99, 255, 0.03), transparent, rgba(168, 85, 247, 0.03), transparent);
            animation: rotate-bg 20s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate-bg {
            100% {
                transform: rotate(360deg);
            }
        }

        .modal .modal-emoji {
            font-size: 52px;
            display: block;
            margin-bottom: 2px;
            position: relative;
            z-index: 1;
        }
        .modal .modal-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
        }
        .modal .modal-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin: 6px 0 14px;
            position: relative;
            z-index: 1;
        }
        .modal .modal-detail {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .modal .modal-actions button {
            padding: 10px 24px;
            border-radius: 99px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }
        .modal .modal-actions .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .modal .modal-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }
        .modal .modal-actions .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }
        .modal .modal-actions .btn-secondary:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        #noteInput {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            margin: 10px 0;
            outline: none;
            transition: border var(--transition);
        }
        #noteInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 10px 26px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-strong);
            font-weight: 600;
            font-size: 13px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            backdrop-filter: blur(12px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: var(--success);
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.10);
        }
        .toast.error {
            border-color: var(--danger);
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.10);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 820px) {
            .app {
                padding: 20px 18px 28px;
                border-radius: 28px;
            }
            .header-title {
                font-size: 24px;
            }
            .stats-bar {
                grid-template-columns: repeat(3, 1fr);
                padding: 12px 12px;
                gap: 6px;
            }
            .stat-item .stat-number {
                font-size: 18px;
            }
            .stat-item .stat-label {
                font-size: 9px;
            }
            .create-section {
                padding: 16px 16px;
            }
            .create-row {
                flex-direction: column;
            }
            .create-row .form-group {
                min-width: 100%;
            }
            .create-row .btn-create {
                width: 100%;
                justify-content: center;
            }
            .controls-row {
                flex-direction: column;
            }
            .controls-row .search-box {
                min-width: 100%;
            }
            .controls-row .filter-group {
                justify-content: center;
            }
            .challenges-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
            .challenge-card {
                aspect-ratio: 1 / 0.8;
                min-height: 150px;
                padding: 14px 12px 10px;
            }
            .card-name {
                font-size: 13px;
            }
            .card-icon {
                font-size: 24px;
            }
            .detail-modal {
                padding: 24px 20px 20px;
                max-width: 100%;
                margin: 12px;
                border-radius: 28px;
            }
            .detail-header .detail-name {
                font-size: 18px;
            }
            .detail-header .detail-icon {
                font-size: 28px;
            }
            .detail-calendar-grid {
                gap: 4px;
            }
            .detail-day {
                min-width: 26px;
                min-height: 26px;
                font-size: 11px;
            }
            .detail-day .day-number {
                font-size: 11px;
            }
            .detail-day .day-check {
                font-size: 12px;
            }
            .modal {
                padding: 28px 20px 24px;
            }
            .modal .modal-title {
                font-size: 22px;
            }
            .modal .modal-emoji {
                font-size: 44px;
            }
        }

        @media (max-width: 500px) {
            .app {
                padding: 14px 10px 20px;
                border-radius: 20px;
            }
            .header-title {
                font-size: 20px;
            }
            .header-subtitle {
                font-size: 11px;
            }
            .stats-bar {
                grid-template-columns: 1fr 1fr 1fr;
                padding: 8px 6px;
                gap: 4px;
            }
            .stat-item .stat-number {
                font-size: 15px;
            }
            .challenges-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .challenge-card {
                aspect-ratio: 1 / 0.75;
                min-height: 120px;
                padding: 10px 10px 8px;
                border-radius: 14px;
            }
            .card-name {
                font-size: 11px;
            }
            .card-icon {
                font-size: 20px;
            }
            .card-stats-row {
                font-size: 10px;
                gap: 8px;
            }
            .card-badge {
                font-size: 8px;
                padding: 1px 8px;
            }
            .card-footer-actions button {
                font-size: 8px;
                padding: 1px 6px;
            }
            .card-click-hint {
                font-size: 8px;
                bottom: 4px;
                right: 8px;
            }
            .detail-modal {
                padding: 16px 14px 16px;
                border-radius: 20px;
                max-height: 95vh;
            }
            .detail-header .detail-name {
                font-size: 15px;
            }
            .detail-header .detail-icon {
                font-size: 22px;
            }
            .detail-stats {
                font-size: 11px;
                gap: 12px;
            }
            .detail-calendar-grid {
                gap: 3px;
            }
            .detail-day {
                min-width: 20px;
                min-height: 20px;
                font-size: 9px;
                border-radius: 4px;
            }
            .detail-day .day-number {
                font-size: 9px;
            }
            .detail-day .day-check {
                font-size: 10px;
            }
            .detail-day .day-tooltip {
                display: none;
            }
            .detail-actions-row button {
                font-size: 10px;
                padding: 4px 12px;
            }
            .modal .modal-actions button {
                flex: 1;
                justify-content: center;
                padding: 9px 14px;
                font-size: 13px;
            }
            .modal {
                padding: 22px 16px 20px;
            }
        }

        @media (max-width: 380px) {
            .challenges-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .challenge-card {
                aspect-ratio: 1 / 0.7;
                min-height: 100px;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ============================================
    PARTICLES & CONFETTI
    ============================================ -->
    <canvas id="particles-canvas" aria-hidden="true"></canvas>
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <!-- ============================================
    TOAST
    ============================================ -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <!-- ============================================
    MAIN APP
    ============================================ -->
    <main class="app" role="main" aria-label="Calendar Streak Tracker">

        <!-- ---- HEADER ---- -->
        <header class="header">
            <div class="header-left">
                <h1 class="header-title">📅 Calendex</h1>
                <span class="header-subtitle">Build habits one day at a time.</span>
            </div>
            <div class="header-actions">
                <button id="exportBtn" aria-label="Export data">📤 Export</button>
                <button id="importBtn" aria-label="Import data">📥 Import</button>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="dot"></span>
                    <span class="icon icon-sun" aria-hidden="true">☀️</span>
                    <span class="icon icon-moon" aria-hidden="true">🌙</span>
                </button>
            </div>
        </header>

        <!-- ---- STATS BAR ---- -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <span class="stat-number" id="statTotal">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="statActive">0</span>
                <span class="stat-label">Active</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="statCompleted">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat-item highlight">
                <span class="stat-number" id="statStreak">0</span>
                <span class="stat-label">🔥 Best Streak</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="statDays">0</span>
                <span class="stat-label">Total Days</span>
            </div>
        </div>

        <!-- ---- CREATE CHALLENGE ---- -->
        <section class="create-section" aria-label="Create new challenge">
            <div class="section-title">✨ Create New Challenge</div>
            <div class="create-row">
                <div class="form-group">
                    <label for="challengeName">Challenge Name</label>
                    <input type="text" id="challengeName" placeholder="e.g. Read, Workout, Study" />
                </div>
                <div class="form-group">
                    <label for="challengeDuration">Duration (Days)</label>
                    <select id="challengeDuration">
                        <option value="7">7 Days</option>
                        <option value="14">14 Days</option>
                        <option value="21">21 Days</option>
                        <option value="30" selected>30 Days</option>
                        <option value="50">50 Days</option>
                        <option value="75">75 Days</option>
                        <option value="100">100 Days</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-group" id="customDurationGroup" style="display:none;">
                    <label for="customDuration">Custom Days</label>
                    <input type="number" id="customDuration" min="1" max="365" value="30" />
                </div>
                <button class="btn-create" id="createBtn">🚀 Create</button>
            </div>
        </section>

        <!-- ---- CONTROLS ---- -->
        <div class="controls-row">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search challenges..." />
            </div>
            <div class="filter-group" id="filterGroup">
                <button class="active" data-filter="all">All</button>
                <button data-filter="active">Active</button>
                <button data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- ---- CHALLENGES GRID ---- -->
        <div class="challenges-grid" id="challengesGrid">
            <!-- Rendered by JavaScript -->
        </div>

        <!-- ---- ACHIEVEMENTS ---- -->
        <section class="achievements-section" aria-label="Achievements">
            <div class="section-title">🏆 Achievements</div>
            <div class="achievements-grid" id="achievementsGrid">
                <!-- Rendered by JavaScript -->
            </div>
        </section>

    </main>

    <!-- ============================================
    DETAIL MODAL — Centered Calendar View
    ============================================ -->
    <div class="detail-overlay" id="detailOverlay" role="dialog" aria-modal="true">
        <div class="detail-modal" id="detailModal">
            <!-- Header -->
            <div class="detail-header">
                <div class="detail-left">
                    <span class="detail-icon" id="detailIcon">🎯</span>
                    <span class="detail-name" id="detailName">Challenge</span>
                    <span class="detail-badge" id="detailBadge">0/30</span>
                </div>
                <button class="detail-close" id="detailCloseBtn" aria-label="Close calendar view">✕</button>
            </div>

            <!-- Stats -->
            <div class="detail-stats" id="detailStats">
                <span>🔥 Streak: <span class="streak" id="detailStreak">0</span></span>
                <span>🏆 Best: <span class="num" id="detailBest">0</span></span>
                <span>📊 <span class="num" id="detailPercent">0%</span></span>
                <span>📅 <span id="detailCompleted">0</span> / <span id="detailTotal">0</span></span>
            </div>

            <!-- Progress -->
            <div class="detail-progress-wrap">
                <div class="progress-fill" id="detailProgressFill" style="width:0%;"></div>
            </div>

            <!-- Calendar Grid -->
            <div class="detail-calendar-grid" id="detailCalendarGrid">
                <!-- Rendered by JavaScript -->
            </div>

            <!-- Actions -->
            <div class="detail-actions-row">
                <button class="btn-reset-detail" id="detailResetBtn">↺ Reset Progress</button>
                <button class="btn-delete-detail" id="detailDeleteBtn">✕ Delete Challenge</button>
            </div>
        </div>
    </div>

    <!-- ============================================
    NOTE MODAL
    ============================================ -->
    <div class="modal-overlay" id="noteOverlay" role="dialog" aria-modal="true">
        <div class="modal" style="max-width:420px;">
            <span class="modal-emoji">📝</span>
            <h2 class="modal-title" style="font-size:20px;">Day Notes</h2>
            <p class="modal-subtitle" id="noteDayLabel">Day 5</p>
            <textarea id="noteInput" placeholder="Write your notes, achievements, or mood…"></textarea>
            <div class="modal-actions">
                <button class="btn-primary" id="noteSaveBtn">💾 Save Note</button>
                <button class="btn-secondary" id="noteCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- ============================================
    COMPLETION MODAL
    ============================================ -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
        <div class="modal">
            <span class="modal-emoji" id="modalEmoji">🎉</span>
            <h2 class="modal-title" id="modalTitle">Challenge Complete!</h2>
            <p class="modal-subtitle" id="modalSubtitle">You've completed your challenge</p>
            <p class="modal-detail" id="modalDetail">Keep up the great work!</p>
            <div class="modal-actions" id="modalActions">
                <button class="btn-primary" id="modalPrimaryBtn">Continue</button>
                <button class="btn-secondary" id="modalSecondaryBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- ============================================
    JAVASCRIPT
    ============================================ -->
    <script>
        (function() {
            'use strict';

            // ==========================================================
            // CONSTANTS
            // ==========================================================
            const STORAGE_KEY = 'streak-tracker-data';
            const ACHIEVEMENTS = [
                { id: '7day', label: '7 Day Warrior', icon: '🥉', days: 7 },
                { id: '15day', label: '15 Day Champion', icon: '🥈', days: 15 },
                { id: '30day', label: '30 Day Master', icon: '🥇', days: 30 },
                { id: '50day', label: '50 Day Legend', icon: '💎', days: 50 },
                { id: '75day', label: '75 Day Elite', icon: '👑', days: 75 },
                { id: '100day', label: '100 Day Elite', icon: '👑', days: 100 },
            ];

            // ==========================================================
