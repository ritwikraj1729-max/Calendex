<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Streak Tracker — Build Habits</title>

    <!-- ============================================
    STYLES — IMPROVED LAYOUT & FULL CALENDAR CARDS
    ============================================ -->
    <style>
        /* ============================================
               CSS VARIABLES / THEMING
               ============================================ */
        :root {
            --bg-primary: #f0f2f8;
            --bg-secondary: #ffffff;
            --bg-panel: rgba(255, 255, 255, 0.55);
            --bg-card: rgba(255, 255, 255, 0.4);
            --bg-glass: rgba(255, 255, 255, 0.15);
            --border-subtle: rgba(255, 255, 255, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-strong: 0 16px 48px rgba(0, 0, 0, 0.10);
            --shadow-glow: 0 0 60px rgba(108, 99, 255, 0.12);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.04);
            --accent: #6C63FF;
            --accent-hover: #5a52d9;
            --accent-glow: rgba(108, 99, 255, 0.2);
            --success: #2ecc71;
            --danger: #ff6b6b;
            --warning: #feca57;
            --gold: #ffd700;
            --radius: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        [data-theme="dark"] {
            --bg-primary: #0b0b1a;
            --bg-secondary: #14142b;
            --bg-panel: rgba(20, 20, 43, 0.75);
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0c0;
            --text-muted: #606080;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-strong: 0 16px 48px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 60px rgba(108, 99, 255, 0.06);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
            --accent-glow: rgba(108, 99, 255, 0.1);
        }

        /* ============================================
               RESET & BASE
               ============================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background var(--transition), color var(--transition);
            line-height: 1.6;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(108, 99, 255, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(108, 99, 255, 0.05) 0%, transparent 60%);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 99px;
        }

        /* ============================================
               PARTICLES & CONFETTI CANVAS
               ============================================ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* ============================================
               APP CONTAINER
               ============================================ */
        .app {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-panel);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--border-subtle);
            border-radius: 40px;
            padding: 32px 36px 40px;
            box-shadow: var(--shadow-strong), var(--shadow-glow);
            transition: background var(--transition), border var(--transition), box-shadow var(--transition);
        }

        /* ============================================
               HEADER
               ============================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), #a855f7, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-actions button {
            padding: 8px 16px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-2px);
        }

        .header-actions button:active {
            transform: scale(0.94);
        }

        .theme-toggle {
            width: 52px;
            height: 28px;
            border-radius: 99px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            position: relative;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .theme-toggle .dot {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            transition: transform var(--transition), background var(--transition);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .theme-toggle[data-theme="dark"] .dot {
            transform: translateX(24px);
            background: #f0e6ff;
        }

        .theme-toggle .icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity var(--transition);
        }
        .theme-toggle .icon-sun {
            left: 6px;
        }
        .theme-toggle .icon-moon {
            right: 6px;
        }
        .theme-toggle[data-theme="dark"] .icon-sun {
            opacity: 0.2;
        }
        .theme-toggle[data-theme="dark"] .icon-moon {
            opacity: 0.9;
        }
        .theme-toggle:not([data-theme="dark"]) .icon-sun {
            opacity: 0.9;
        }
        .theme-toggle:not([data-theme="dark"]) .icon-moon {
            opacity: 0.2;
        }

        /* ============================================
               STATS BAR
               ============================================ */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(4px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .stat-number {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            display: block;
            line-height: 1.2;
        }

        .stat-item .stat-number.animate {
            animation: countUp 0.5s ease-out;
        }

        @keyframes countUp {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(6px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .stat-item .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-item.highlight .stat-number {
            color: var(--gold);
        }

        /* ============================================
               CREATE CHALLENGE — "Control Panel" Card
               ============================================ */
        .create-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(8px);
            margin-bottom: 28px;
            transition: all var(--transition);
            box-shadow: var(--shadow-card);
        }

        .create-section:hover {
            border-color: rgba(108, 99, 255, 0.15);
        }

        .create-section .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.02em;
        }

        .create-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .create-row .form-group {
            flex: 1;
            min-width: 140px;
        }

        .create-row .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .create-row .form-group input,
        .create-row .form-group select {
            width: 100%;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all var(--transition);
            outline: none;
        }

        .create-row .form-group input:focus,
        .create-row .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .create-row .form-group input::placeholder {
            color: var(--text-muted);
        }

        .create-row .btn-create {
            padding: 10px 32px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), #a855f7);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            box-shadow: 0 4px 20px var(--accent-glow);
            white-space: nowrap;
            min-height: 46px;
        }

        .create-row .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .create-row .btn-create:active {
            transform: scale(0.94);
        }

        /* ============================================
               FILTER & SEARCH
               ============================================ */
        .controls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }

        .controls-row .search-box {
            flex: 1;
            min-width: 160px;
            position: relative;
        }

        .controls-row .search-box input {
            width: 100%;
            padding: 8px 16px 8px 36px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all var(--transition);
            outline: none;
        }

        .controls-row .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .controls-row .search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .controls-row .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .controls-row .filter-group button {
            padding: 6px 16px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .controls-row .filter-group button:hover {
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .controls-row .filter-group button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ============================================
               CHALLENGE CARDS — Full Calendar
               ============================================ */
        .challenges-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
        }

        .challenge-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px 28px;
            border: 1px solid var(--border-subtle);
            transition: all var(--transition);
            animation: slideUp 0.4s ease;
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow-card);
        }

        .challenge-card:hover {
            border-color: rgba(108, 99, 255, 0.15);
            box-shadow: var(--shadow-glow);
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .challenge-card .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .challenge-card .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .challenge-card .card-title .icon {
            font-size: 24px;
        }

        .challenge-card .card-title .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 99px;
            background: var(--accent-glow);
            color: var(--accent);
        }

        .challenge-card .card-title .badge.completed {
            background: rgba(46, 204, 113, 0.15);
            color: var(--success);
        }

        .challenge-card .card-actions {
            display: flex;
            gap: 6px;
        }

        .challenge-card .card-actions button {
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .challenge-card .card-actions button:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .challenge-card .card-actions .btn-delete:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(255, 107, 107, 0.08);
        }

        .challenge-card .card-actions .btn-reset:hover {
            color: var(--warning);
            border-color: var(--warning);
            background: rgba(254, 202, 87, 0.08);
        }

        /* ---- Progress Row ---- */
        .progress-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            margin-bottom: 14px;
            align-items: center;
        }

        .progress-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .progress-info span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .progress-info .num {
            font-weight: 700;
            color: var(--text-primary);
        }

        .progress-info .streak {
            color: var(--gold);
            font-weight: 700;
        }

        /* ---- Progress Bar ---- */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: var(--bg-primary);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
        }

        .progress-bar-container .progress-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
            position: relative;
        }

        .progress-bar-container .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 20px;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 99px;
        }

        .progress-bar-container .progress-fill.complete {
            background: linear-gradient(90deg, var(--success), #2ecc71);
        }

        /* ---- Calendar Grid (FULLY OPEN) ---- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
            gap: 10px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
            /* NO max-height, NO overflow-y: auto -> FULL CALENDAR */
        }

        .day-cell {
            aspect-ratio: 1;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border-subtle);
            background: var(--bg-glass);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            user-select: none;
            min-width: 38px;
            min-height: 38px;
        }

        .day-cell:hover {
            transform: scale(1.06);
            border-color: var(--accent);
            z-index: 2;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .day-cell .day-number {
            font-size: 13px;
            font-weight: 600;
            line-height: 1;
        }

        .day-cell .day-check {
            font-size: 16px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: absolute;
        }

        .day-cell.completed {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .day-cell.completed .day-number {
            opacity: 0;
        }

        .day-cell.completed .day-check {
            opacity: 1;
            transform: scale(1);
        }

        .day-cell.completed.pop {
            animation: popComplete 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popComplete {
            0% {
                transform: scale(0.6);
                opacity: 0.5;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .day-cell.today {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .day-cell.today::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold);
        }

        .day-cell .day-tooltip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            box-shadow: var(--shadow-strong);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            border: 1px solid var(--border-subtle);
            font-weight: 400;
        }

        .day-cell:hover .day-tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* ============================================
               ACHIEVEMENTS
               ============================================ */
        .achievements-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-subtle);
        }

        .achievements-section .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .achievements-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .achievement-badge {
            padding: 8px 18px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-glass);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all var(--transition);
            opacity: 0.3;
        }

        .achievement-badge.unlocked {
            opacity: 1;
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.08);
            color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.08);
            animation: badgeUnlock 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes badgeUnlock {
            0% {
                transform: scale(0.4) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .achievement-badge .badge-icon {
            font-size: 18px;
        }

        /* ============================================
               MODALS
               ============================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 40px;
            padding: 40px 44px 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-strong), 0 0 80px var(--accent-glow);
            border: 1px solid var(--border-subtle);
            animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .modal::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, transparent, rgba(108, 99, 255, 0.03), transparent, rgba(168, 85, 247, 0.03), transparent);
            animation: rotate-bg 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate-bg {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.6) rotate(-4deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .modal .modal-emoji {
            font-size: 56px;
            display: block;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }

        .modal .modal-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
        }

        .modal .modal-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin: 8px 0 16px;
            position: relative;
            z-index: 1;
        }

        .modal .modal-detail {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .modal .modal-actions button {
            padding: 12px 28px;
            border-radius: 99px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .modal .modal-actions .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .modal .modal-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .modal .modal-actions .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .modal .modal-actions .btn-secondary:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* ============================================
               TOAST
               ============================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 99px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-strong);
            font-weight: 600;
            font-size: 14px;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: var(--success);
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.12);
        }

        .toast.error {
            border-color: var(--danger);
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.12);
        }

        /* ============================================
               RESPONSIVE
               ============================================ */
        @media (max-width: 768px) {
            .app {
                padding: 20px 18px 28px;
                border-radius: 28px;
            }

            .header-title {
                font-size: 22px;
            }
            .header-subtitle {
                font-size: 12px;
            }

            .stats-bar {
                grid-template-columns: repeat(3, 1fr);
                padding: 12px 14px;
                gap: 8px;

            .stat-item .stat-number {
                font-size: 18px;
            }
            .stat-item .stat-label {

            .create-section {

            }
            .create-row {
                flex-direction: column;
            }
            .create-row .form-group {
                min-width: 100%;

            .create-row .btn-create {
                width: 100%;
                justify-content: center;
            }

            .controls-row {

            .controls-row .search-box {

            .challenge-card {

            .challenge-card .card-title {

            }

            .progress-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .progress-info {
                font-size: 13px;
                gap: 12px;
            }

            .calendar-grid {
                grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));

            .day-cell {

            .modal {
                padding: 28px 20px 24px;
            }
            .modal .modal-title {
                font-size: 22px;
            }
            .modal .modal-emoji {
                font-size: 44px;
            }
        }

        @media (max-width: 420px) {
            .app {
                padding: 14px 12px 20px;
                border-radius: 20px;
            }

            .header-title {
                font-size: 18px;

                grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
                gap: 6px;
            }
            .day-cell {
                min-width: 26px;
                min-height: 26px;
                font-size: 9px;
            }
            .day-cell .day-number {
                font-size: 9px;
            }

            .modal .modal-actions button {
                flex: 1;
                justify-content: center;
                padding: 10px 16px;
                font-size: 13px;
            }
        }

        /* ============================================
               UTILITY
               ============================================ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ============================================
    PARTICLES & CONFETTI CANVAS

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <!-- ============================================
    MAIN APP
    ============================================ -->
    <main class="app" role="main" aria-label="Calendar Streak Tracker">

        <!-- ---- HEADER ---- -->

    <!-- ============================================
    MODALS
    ============================================ -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
        <div class="modal">

    <div class="modal-overlay" id="noteOverlay" role="dialog" aria-modal="true">
        <div class="modal" style="max-width: 420px;">
            <span class="modal-emoji">📝</span>
