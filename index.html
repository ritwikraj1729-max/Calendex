            // ==========================================================
            // PARTICLES
            // ==========================================================
            class ParticleBackground {
                constructor(canvas) {
                    this.canvas = canvas;
                    this.ctx = canvas.getContext('2d');
                    this.particles = [];
                    this.frame = null;
                    this.resize();
                    window.addEventListener('resize', () => this.resize());
                    this._init();
                    this._animate();
                }
                resize() {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                }
                _init() {
                    const count = Math.min(40, Math.floor((this.canvas.width * this.canvas.height) / 25000));
                    this.particles = [];
                    for (let i = 0; i < count; i++) {
                        this.particles.push({
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height,
                            r: 1.5 + Math.random() * 3,
                            dx: (Math.random() - 0.5) * 0.25,
                            dy: (Math.random() - 0.5) * 0.25,
                            opacity: 0.12 + Math.random() * 0.28,
                        });
                    }
                }
                _animate() {
                    const ctx = this.ctx;
                    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    const color = isDark ? 'rgba(255,255,255,' : 'rgba(108,99,255,';
                    for (const p of this.particles) {
                        p.x += p.dx;
                        p.y += p.dy;
                        if (p.x < 0) p.x = this.canvas.width;
                        if (p.x > this.canvas.width) p.x = 0;
                        if (p.y < 0) p.y = this.canvas.height;
                        if (p.y > this.canvas.height) p.y = 0;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = color + p.opacity + ')';
                        ctx.fill();
                    }
                    this.frame = requestAnimationFrame(() => this._animate());
                }
                destroy() { if (this.frame) cancelAnimationFrame(this.frame); }
            }
            const particles = new ParticleBackground(dom.particlesCanvas);

            // ==========================================================
            // CONFETTI
            // ==========================================================
            class ConfettiEngine {
                constructor(canvas) {
                    this.canvas = canvas;
                    this.ctx = canvas.getContext('2d');
                    this.pieces = [];
                    this.running = false;
                    this.frame = null;
                    this.resize();
                    window.addEventListener('resize', () => this.resize());
                }
                resize() {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                }
                burst(count = 120) {
                    const colors = ['#6C63FF', '#FF6B6B', '#FECA57', '#2ECC71', '#A855F7', '#FF9FF3', '#54A0FF', '#FF9F43'];
                    for (let i = 0; i < count; i++) {
                        this.pieces.push({
                            x: this.canvas.width / 2 + (Math.random() - 0.5) * 120,
                            y: this.canvas.height / 2 + (Math.random() - 0.5) * 80,
                            vx: (Math.random() - 0.5) * 20,
                            vy: (Math.random() - 0.5) * 20 - 5,
                            size: 6 + Math.random() * 10,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            life: 1,
                            decay: 0.005 + Math.random() * 0.012,
                            rotation: Math.random() * 360,
                            rotSpeed: (Math.random() - 0.5) * 12,
                            shape: Math.random() > 0.4 ? 'rect' : 'circle',
                        });
                    }
                    if (!this.running) { this.running = true;
                        this._animate(); }
                }
                _animate() {
                    if (!this.running) return;
                    const ctx = this.ctx;
                    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    let alive = false;
                    for (const p of this.pieces) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.15;
                        p.vx *= 0.99;
                        p.life -= p.decay;
                        p.rotation += p.rotSpeed;
                        if (p.life <= 0) continue;
                        alive = true;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.life);
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = p.color;
                        if (p.shape === 'rect') {
                            ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                        } else {
                            ctx.beginPath();
                            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                    this.pieces = this.pieces.filter(p => p.life > 0);
                    if (this.pieces.length > 0) {
                        this.frame = requestAnimationFrame(() => this._animate());
                    } else {
                        this.running = false;
                        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    }
                }
            }
            const confetti = new ConfettiEngine(dom.confettiCanvas);

            // ==========================================================
            // AUDIO
            // ==========================================================
            class AudioEngine {
                constructor() {
                    this.ctx = null;
                    this.enabled = true;
                    try { this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.enabled =
                        false; }
                }
                _playTone(freq, duration, volume = 0.1) {
                    if (!this.enabled || !this.ctx) return;
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch (_) {}
                }
                click() { this._playTone(800, 0.05, 0.08); }
                complete() {
                    this._playTone(523, 0.1, 0.15);
                    setTimeout(() => this._playTone(659, 0.1, 0.15), 100);
                    setTimeout(() => this._playTone(784, 0.15, 0.2), 200);
                }
                milestone() {
                    this._playTone(440, 0.08, 0.12);
                    setTimeout(() => this._playTone(554, 0.08, 0.12), 80);
                    setTimeout(() => this._playTone(659, 0.12, 0.15), 160);
                }
            }
            const audio = new AudioEngine();

            // ==========================================================
            // TOAST
            // ==========================================================
            let toastTimeout = null;

            function showToast(message, type = 'success') {
                const el = dom.toast;
                el.textContent = message;
                el.className = 'toast ' + type;
                clearTimeout(toastTimeout);
                void el.offsetWidth;
                el.classList.add('show');
                toastTimeout = setTimeout(() => { el.classList.remove('show'); }, 2200);
            }

            // ==========================================================
            // ID GENERATOR
            // ==========================================================
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
            }

            // ==========================================================
            // CHALLENGE CRUD
            // ==========================================================

            function createChallenge(name, duration) {
                if (!name || name.trim() === '') {
                    showToast('Please enter a challenge name', 'error');
                    return false;
                }
                name = name.trim();
                if (state.challenges.some(c => c.name.toLowerCase() === name.toLowerCase())) {
                    showToast('A challenge with this name already exists', 'error');
                    return false;
                }
                const challenge = {
                    id: generateId(),
                    name: name,
                    duration: duration,
                    days: {},
                    createdAt: Date.now(),
                    completedAt: null,
                    icon: '🎯',
                };
                for (let i = 1; i <= duration; i++) {
                    challenge.days[i] = { completed: false, note: '' };
                }
                state.challenges.push(challenge);
                saveData();
                renderAll();
                showToast(`✨ Challenge "${name}" created!`, 'success');
                audio.click();
                return true;
            }

            function deleteChallenge(id) {
                if (!confirm('Delete this challenge? All progress will be lost.')) return;
                state.challenges = state.challenges.filter(c => c.id !== id);
                if (state.detailTargetId === id) closeDetailView();
                saveData();
                renderAll();
                showToast('Challenge deleted', 'success');
                audio.click();
            }

            function resetChallenge(id) {
                if (!confirm('Reset all progress for this challenge?')) return;
                const challenge = state.challenges.find(c => c.id === id);
                if (!challenge) return;
                for (let i = 1; i <= challenge.duration; i++) {
                    challenge.days[i] = { completed: false, note: '' };
                }
                challenge.completedAt = null;
                saveData();
                renderAll();
                if (state.detailTargetId === id) renderDetailView(id);
                showToast('Challenge reset', 'success');
                audio.click();
            }

            function toggleDay(challengeId, dayIndex) {
                const challenge = state.challenges.find(c => c.id === challengeId);
                if (!challenge) return;
                if (challenge.completedAt) {
                    showToast('This challenge is already completed!', 'error');
                    return;
                }
                const day = challenge.days[dayIndex];
                if (!day) return;
                day.completed = !day.completed;
                if (day.completed) {
                    audio.click();
                    checkChallengeCompletion(challenge);
                    checkMilestone(challenge, dayIndex);
                } else {
                    audio.click();
                }
                saveData();
                renderAll();
                if (state.detailTargetId === challengeId) renderDetailView(challengeId);
            }

            function updateDayNote(challengeId, dayIndex, note) {
                const challenge = state.challenges.find(c => c.id === challengeId);
                if (!challenge) return;
                const day = challenge.days[dayIndex];
                if (!day) return;
                day.note = note;
                saveData();
                renderAll();
                if (state.detailTargetId === challengeId) renderDetailView(challengeId);
                showToast('📝 Note saved!', 'success');
                audio.click();
            }

            function checkChallengeCompletion(challenge) {
                const allCompleted = Object.values(challenge.days).every(d => d.completed);
                if (allCompleted && !challenge.completedAt) {
                    challenge.completedAt = Date.now();
                    saveData();
                    showCompletionModal(challenge);
                    audio.complete();
                    confetti.burst(180);
                }
            }

            function checkMilestone(challenge, dayIndex) {
                const milestoneDays = [7, 15, 21, 30, 50, 75, 100];
                if (milestoneDays.includes(dayIndex)) {
                    let allPrevCompleted = true;
                    for (let i = 1; i <= dayIndex; i++) {
                        if (!challenge.days[i].completed) { allPrevCompleted = false; break; }
                    }
                    if (allPrevCompleted) {
                        audio.milestone();
                        confetti.burst(80);
                        showToast(`🎉 Milestone: ${dayIndex} days completed!`, 'success');
                        updateAchievements();
                    }
                }
            }

            // ==========================================================
            // STREAK CALCULATIONS
            // ==========================================================

            function calculateCurrentStreak(challenge) {
                let streak = 0;
                const days = Object.values(challenge.days);
                for (let i = 0; i < days.length; i++) {
                    if (days[i].completed) {
                        streak++;
                    } else {
                        break;
                    }
                }
                return streak;
            }

            function calculateLongestStreak(challenge) {
                let maxStreak = 0;
                let currentStreak = 0;
                const days = Object.values(challenge.days);
                for (const day of days) {
                    if (day.completed) {
                        currentStreak++;
                        if (currentStreak > maxStreak) maxStreak = currentStreak;
                    } else {
                        currentStreak = 0;
                    }
                }
                return maxStreak;
            }

            function calculateProgress(challenge) {
                const days = Object.values(challenge.days);
                const completed = days.filter(d => d.completed).length;
                const total = days.length;
                return { completed, total, percentage: total > 0 ? (completed / total) * 100 : 0 };
            }

            // ==========================================================
            // ACHIEVEMENTS
            // ==========================================================
            function getUnlockedAchievements() {
                const unlocked = [];
                for (const ach of ACHIEVEMENTS) {
                    let hasStreak = false;
                    for (const challenge of state.challenges) {
                        const streak = calculateCurrentStreak(challenge);
                        if (streak >= ach.days) { hasStreak = true; break; }
                        const longest = calculateLongestStreak(challenge);
                        if (longest >= ach.days) { hasStreak = true; break; }
                    }
                    if (hasStreak) unlocked.push(ach);
                }
                return unlocked;
            }

            function updateAchievements() {
                const unlocked = getUnlockedAchievements();
                const grid = dom.achievementsGrid;
                if (unlocked.length === 0) {
                    grid.innerHTML =
                        `<span style="color:var(--text-muted);font-size:13px;">Complete challenges to unlock achievements!</span>`;
                    return;
                }
                let html = '';
                for (const ach of ACHIEVEMENTS) {
                    const isUnlocked = unlocked.some(u => u.id === ach.id);
                    html += `
                        <div class="achievement-badge ${isUnlocked ? 'unlocked' : ''}">
                            <span class="badge-icon">${ach.icon}</span>
                            ${ach.label}
                        </div>
                    `;
                }
                grid.innerHTML = html;
            }

            // ==========================================================
            // DETAIL VIEW (Centered Modal)
            // ==========================================================

            function openDetailView(challengeId) {
                state.detailTargetId = challengeId;
                dom.detailOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                renderDetailView(challengeId);
            }

            function closeDetailView() {
                dom.detailOverlay.classList.remove('active');
                document.body.style.overflow = '';
                state.detailTargetId = null;
            }

            function renderDetailView(challengeId) {
                const challenge = state.challenges.find(c => c.id === challengeId);
                if (!challenge) { closeDetailView(); return; }

                const progress = calculateProgress(challenge);
                const currentStreak = calculateCurrentStreak(challenge);
                const longestStreak = calculateLongestStreak(challenge);
                const isCompleted = !!challenge.completedAt;

                dom.detailIcon.textContent = challenge.icon || '🎯';
                dom.detailName.textContent = challenge.name;
                dom.detailBadge.textContent = isCompleted ? '✅ Done' : `${progress.completed}/${progress.total}`;
                dom.detailBadge.className = 'detail-badge' + (isCompleted ? ' completed' : '');

                dom.detailStreak.textContent = currentStreak;
                dom.detailBest.textContent = longestStreak;
                dom.detailPercent.textContent = progress.percentage.toFixed(0) + '%';
                dom.detailCompleted.textContent = progress.completed;
                dom.detailTotal.textContent = progress.total;

                dom.detailProgressFill.style.width = progress.percentage + '%';
                dom.detailProgressFill.className = 'progress-fill' + (isCompleted ? ' complete' : '');

                // Build calendar grid
                let html = '';
                for (let i = 1; i <= challenge.duration; i++) {
                    const day = challenge.days[i];
                    const isCompletedDay = day.completed;
                    const isStreakDay = isCompletedDay && (i <= currentStreak);
                    const hasNote = day.note && day.note.trim() !== '';
                    const isToday = (i === currentStreak + 1) && !isCompleted;

                    let classes = 'detail-day';
                    if (isCompletedDay) classes += ' completed';
                    if (isStreakDay && currentStreak > 0) classes += ' streak';
                    if (isToday) classes += ' today';
                    if (hasNote) classes += ' has-note';

                    html += `
                        <div class="${classes}" 
                             data-challenge="${challenge.id}" data-day="${i}"
                             role="button" tabindex="0" aria-label="Day ${i} ${isCompletedDay ? 'completed' : 'incomplete'}">
                            <span class="day-number">${i}</span>
                            <span class="day-check">${isCompletedDay ? '✓' : ''}</span>
                            <span class="day-tooltip">Day ${i}${hasNote ? ' 📝' : ''}</span>
                        </div>
                    `;
                }
                dom.detailCalendarGrid.innerHTML = html;

                // Day click events
                dom.detailCalendarGrid.querySelectorAll('.detail-day').forEach(cell => {
                    cell.addEventListener('click', (e) => {
                        const cId = cell.dataset.challenge;
                        const dayIndex = parseInt(cell.dataset.day);
                        const c = state.challenges.find(ch => ch.id === cId);
                        if (!c) return;
                        if (c.completedAt) {
                            showToast('This challenge is already completed!', 'error');
                            return;
                        }
                        if (e.shiftKey || e.detail === 2) {
                            const d = c.days[dayIndex];
                            if (d.completed) {
                                openNotePopup(cId, dayIndex);
                            } else {
                                showToast('Complete this day first to add a note', 'error');
                            }
                            return;
                        }
                        toggleDay(cId, dayIndex);
                    });
                    cell.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                            cell.click(); }
                    });
                    cell.addEventListener('dblclick', () => {
                        const cId = cell.dataset.challenge;
                        const dayIndex = parseInt(cell.dataset.day);
                        const c = state.challenges.find(ch => ch.id === cId);
                        if (c && c.days[dayIndex]?.completed) {
                            openNotePopup(cId, dayIndex);
                        }
                    });
                });

                // Detail action buttons
                dom.detailResetBtn.onclick = () => { resetChallenge(challengeId); };
                dom.detailDeleteBtn.onclick = () => { deleteChallenge(challengeId); };
            }

            // ==========================================================
            // NOTE POPUP
            // ==========================================================

            function openNotePopup(challengeId, dayIndex) {
                const challenge = state.challenges.find(c => c.id === challengeId);
                if (!challenge) return;
                const day = challenge.days[dayIndex];
                if (!day) return;
                state.noteTarget = { challengeId, dayIndex };
                dom.noteDayLabel.textContent = `Day ${dayIndex} — ${challenge.name}`;
                dom.noteInput.value = day.note || '';
                dom.noteOverlay.classList.add('active');
                dom.noteInput.focus();
            }

            function closeNotePopup() {
                dom.noteOverlay.classList.remove('active');
                state.noteTarget = null;
            }

            function saveNote() {
                if (!state.noteTarget) return;
                const { challengeId, dayIndex } = state.noteTarget;
                const note = dom.noteInput.value.trim();
                updateDayNote(challengeId, dayIndex, note);
                closeNotePopup();
            }

            // ==========================================================
            // COMPLETION MODAL
            // ==========================================================

            function showCompletionModal(challenge) {
                dom.modalEmoji.textContent = '🎉';
                dom.modalTitle.textContent = 'Challenge Complete!';
                dom.modalSubtitle.textContent = `"${challenge.name}" completed!`;
                const days = Object.values(challenge.days).filter(d => d.completed).length;
                dom.modalDetail.textContent = `✅ ${days} days completed. Keep building your habits!`;
                dom.modalPrimaryBtn.textContent = '🎯 New Challenge';
                dom.modalPrimaryBtn.onclick = () => {
                    dom.modalOverlay.classList.remove('active');
                    dom.challengeName.focus();
                    audio.click();
                };
                dom.modalSecondaryBtn.textContent = 'Close';
                dom.modalSecondaryBtn.onclick = () => {
                    dom.modalOverlay.classList.remove('active');
                    audio.click();
                };
                dom.modalOverlay.classList.add('active');
            }

            // ==========================================================
            // THEME
            // ==========================================================

            function loadTheme() {
                const saved = localStorage.getItem('streak-tracker-theme');
                setTheme(saved || 'dark');
            }

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                dom.themeToggle.setAttribute('data-theme', theme);
                localStorage.setItem('streak-tracker-theme', theme);
                particles._init();
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
                audio.click();
            }

            // ==========================================================
            // RENDER FUNCTIONS
            // ==========================================================

            function renderAll() {
                renderStats();
                renderChallenges();
                renderAchievements();
                if (state.detailTargetId) {
                    const stillExists = state.challenges.some(c => c.id === state.detailTargetId);
                    if (!stillExists) closeDetailView();
                    else renderDetailView(state.detailTargetId);
                }
            }

            function renderStats() {
                const total = state.challenges.length;
                const active = state.challenges.filter(c => !c.completedAt).length;
                const completed = state.challenges.filter(c => c.completedAt).length;
                let totalDays = 0;
                let bestStreak = 0;
                for (const c of state.challenges) {
                    const days = Object.values(c.days);
                    totalDays += days.filter(d => d.completed).length;
                    const streak = calculateLongestStreak(c);
                    if (streak > bestStreak) bestStreak = streak;
                }
                animateNumber(dom.statTotal, total);
                animateNumber(dom.statActive, active);
                animateNumber(dom.statCompleted, completed);
                animateNumber(dom.statStreak, bestStreak);
                animateNumber(dom.statDays, totalDays);
            }

            function animateNumber(el, target) {
                const current = parseInt(el.textContent) || 0;
                if (current === target) return;
                el.textContent = target;
                el.classList.remove('animate');
                void el.offsetWidth;
                el.classList.add('animate');
            }

            function renderChallenges() {
                const grid = dom.challengesGrid;
                let filtered = [...state.challenges];
                const search = dom.searchInput.value.toLowerCase().trim();
                if (search) filtered = filtered.filter(c => c.name.toLowerCase().includes(search));
                const filter = state.filter;
                if (filter === 'active') filtered = filtered.filter(c => !c.completedAt);
                else if (filter === 'completed') filtered = filtered.filter(c => c.completedAt);

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text-muted);">
                            <div style="font-size:48px;margin-bottom:12px;">📭</div>
                            <p style="font-size:16px;">No challenges found</p>
                            <p style="font-size:14px;margin-top:4px;">Create your first challenge above!</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const challenge of filtered) {
                    const progress = calculateProgress(challenge);
                    const currentStreak = calculateCurrentStreak(challenge);
                    const longestStreak = calculateLongestStreak(challenge);
                    const isCompleted = !!challenge.completedAt;

                    html += `
                        <div class="challenge-card" data-id="${challenge.id}">
                            <div class="card-icon">${challenge.icon || '🎯'}</div>
                            <div class="card-name">${challenge.name}</div>
                            <span class="card-badge ${isCompleted ? 'completed' : ''}">
                                ${isCompleted ? '✅ Done' : `${progress.completed}/${progress.total}`}
                            </span>
                            <div class="card-stats-row">
                                <span>🔥 <span class="streak">${currentStreak}</span></span>
                                <span>🏆 <span class="num">${longestStreak}</span></span>
                                <span>📊 <span class="num">${progress.percentage.toFixed(0)}%</span></span>
                            </div>
                            <div class="card-progress-wrap">
                                <div class="progress-fill ${isCompleted ? 'complete' : ''}" style="width:${progress.percentage}%;"></div>
                            </div>
                            <div class="card-footer-actions">
                                <button class="btn-reset" data-id="${challenge.id}" aria-label="Reset">↺</button>
                                <button class="btn-delete" data-id="${challenge.id}" aria-label="Delete">✕</button>
                            </div>
                            <span class="card-click-hint">click to open</span>
                        </div>
                    `;
                }

                grid.innerHTML = html;

                // Card click: open detail view
                grid.querySelectorAll('.challenge-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('button')) return;
                        const id = card.dataset.id;
                        if (id) openDetailView(id);
                    });
                });

                // Card action buttons
                grid.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', (e) => { e.stopPropagation();
                        deleteChallenge(btn.dataset.id); });
                });
                grid.querySelectorAll('.btn-reset').forEach(btn => {
                    btn.addEventListener('click', (e) => { e.stopPropagation();
                        resetChallenge(btn.dataset.id); });
                });
            }

            function renderAchievements() { updateAchievements(); }

            // ==========================================================
            // LOCAL STORAGE
            // ==========================================================

            function saveData() {
                try {
                    const data = { challenges: state.challenges, theme: state.theme };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (_) {}
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (data.challenges) state.challenges = data.challenges;
                    if (data.theme) state.theme = data.theme;
                    return true;
                } catch (_) { return false; }
            }

            // ==========================================================
            // IMPORT / EXPORT
            // ==========================================================

            function exportData() {
                if (state.challenges.length === 0) { showToast('No data to export', 'error'); return; }
                const data = { challenges: state.challenges, version: '1.0', exported: new Date().toISOString() };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `streak-data-${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📤 Data exported!', 'success');
                audio.click();
            }

            function importData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'application/json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (!data.challenges || !Array.isArray(data.challenges)) throw new Error('Invalid');
                            if (data.challenges.length === 0) { showToast('No challenges in the file', 'error'); return; }
                            if (state.challenges.length > 0) {
                                if (!confirm('⚠️ This will replace all current data. Continue?')) return;
                            }
                            state.challenges = data.challenges;
                            saveData();
                            renderAll();
                            showToast(`📥 Imported ${state.challenges.length} challenges!`, 'success');
                            audio.click();
                        } catch (_) { showToast('❌ Invalid file format', 'error'); }
                    };
                    reader.readAsText(file);
                };
                input.click();
                audio.click();
            }

            // ==========================================================
            // EVENT BINDING
            // ==========================================================

            dom.createBtn.addEventListener('click', () => {
                const name = dom.challengeName.value.trim();
                let duration = parseInt(dom.challengeDuration.value);
                if (dom.challengeDuration.value === 'custom') {
                    duration = parseInt(dom.customDuration.value) || 30;
                }
                if (duration < 1) duration = 7;
                if (createChallenge(name, duration)) {
                    dom.challengeName.value = '';
                    dom.challengeName.focus();
                }
            });

            dom.challengeName.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault();
                    dom.createBtn.click(); }
            });

            dom.challengeDuration.addEventListener('change', () => {
                dom.customDurationGroup.style.display = dom.challengeDuration.value === 'custom' ? 'block' : 'none';
            });

            dom.searchInput.addEventListener('input', () => { renderChallenges(); });

            dom.filterGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn || !btn.dataset.filter) return;
                dom.filterGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.filter = btn.dataset.filter;
                renderChallenges();
                audio.click();
            });

            dom.themeToggle.addEventListener('click', toggleTheme);
            dom.exportBtn.addEventListener('click', exportData);
            dom.importBtn.addEventListener('click', importData);

            // Detail close
            dom.detailCloseBtn.addEventListener('click', closeDetailView);
            dom.detailOverlay.addEventListener('click', (e) => {
                if (e.target === dom.detailOverlay) closeDetailView();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (dom.detailOverlay.classList.contains('active')) closeDetailView();
                    if (dom.noteOverlay.classList.contains('active')) closeNotePopup();
                    if (dom.modalOverlay.classList.contains('active')) dom.modalOverlay.classList.remove('active');
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                    if (!dom.detailOverlay.classList.contains('active')) {
                        e.preventDefault();
                        dom.challengeName.focus();
                    }
                }
            });

            // Note modal
            dom.noteSaveBtn.addEventListener('click', saveNote);
            dom.noteCloseBtn.addEventListener('click', closeNotePopup);
            dom.noteOverlay.addEventListener('click', (e) => { if (e.target === dom.noteOverlay) closeNotePopup(); });
            dom.noteInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault();
                    saveNote(); }
                if (e.key === 'Escape') closeNotePopup();
            });

            // Completion modal
            dom.modalOverlay.addEventListener('click', (e) => {
                if (e.target === dom.modalOverlay) dom.modalOverlay.classList.remove('active');
            });

            // ==========================================================
            // INIT
            // ==========================================================

            function init() {
                loadTheme();
                const hasData = loadData();
                if (!hasData || state.challenges.length === 0) {
                    const samples = [
                        { name: '📚 Read Books', duration: 30 },
                        { name: '💪 Workout', duration: 21 },
                        { name: '🧘 Meditate', duration: 14 },
                        { name: '💻 Code Daily', duration: 50 },
                    ];
                    for (const s of samples) {
                        const challenge = {
                            id: generateId(),
                            name: s.name,
                            duration: s.duration,
                            days: {},
                            createdAt: Date.now(),
                            completedAt: null,
                            icon: s.name.match(/^.{1,2}/)?.[0] || '🎯',
                        };
                        for (let i = 1; i <= s.duration; i++) {
                            challenge.days[i] = { completed: false, note: '' };
                        }
                        state.challenges.push(challenge);
                    }
                    saveData();
                }
                renderAll();
                dom.challengeName.focus();
                console.log('📅 Calendex loaded!');
                console.log(`📋 ${state.challenges.length} challenges loaded.`);
                console.log('⌨️ Ctrl+N to focus name, Esc to close modals');
                console.log('💡 Click any challenge card to open its calendar in a centered view.');
                console.log('🔥 Days in the current streak glow gold!');
            }

            init();

        })();
    </script>

</body>
</html>
